  emotion: {name:'情绪牵引力',topic:'对回应的敏感',high:'对方的反馈容易牵动你的心情，你可能会在等待和猜测中消耗精力。',low:'你通常能让自己的心情保持独立，不会被一次回复决定一整天。',action:'想反复查看聊天框时，先给自己设一个20分钟的免打扰时间。'},

  {max:39,name:'慢热守门员',caption:'会心动，也会慢慢确认值不值得。',quote:'你对心动保留了一点谨慎，关系升温时仍愿意为自己留一点空间。',line:'心动可以快，交心要慢。'},
  {max:59,name:'清醒心动派',caption:'脑子在线，心也确实会偷偷加速。',quote:'你既希望投入一段关系，也想守住自己的生活。某些时刻会小小上头，但不代表失控。',line:'可以喜欢你，也不会丢掉我。'},
  {max:79,name:'上头小行星',caption:'对方轻轻靠近，你的内心就开始公转。',quote:'你的情绪、注意力和期待容易被心动牵引。可爱的是投入，辛苦的是偶尔忘记照顾自己。',line:'恋爱有引力，我也要有轨道。'},

const state={page:'intro',i:0,answers:Array(QUESTIONS.length).fill(null),unlocked:false};
const app=document.querySelector('#app');
const modals=document.querySelector('#modal-root');
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const toPercent=(sum,n)=>Math.round((sum-n)/((n*5)-n)*100);
function getResult(){
  const dims={};for(const k of Object.keys(DIMENSIONS)){
    let sum=0,n=0;
    QUESTIONS.forEach((q,i)=>{if(q.d!==k)return;n++;const a=state.answers[i]??3;sum+=(q.reverse?6-a:a)});
    dims[k]=toPercent(sum,n);
  }
  const score=Math.round(Object.values(dims).reduce((a,b)=>a+b,0)/4);
  const profile=PROFILES.find(p=>score<=p.max);
  const ordered=Object.keys(dims).sort((a,b)=>dims[b]-dims[a]);
  return {dims,score,profile,ordered,top:ordered[0],low:ordered[3]};
